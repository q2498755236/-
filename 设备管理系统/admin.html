<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARDKEY OS - 管理终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
    --bg: #0a0a0c;
    --bg2: #101014;
    --panel: #131318;
    --line: #232329;
    --line2: #2e2e36;
    --txt: #f2f2f0;
    --txt2: #8b8b93;
    --txt3: #55555e;
    --acid: #c8ff00;
    --acid-dim: rgba(200,255,0,.12);
    --red: #ff3d5a;
    --org: #ff9f1c;
    --grn: #00e07f;
    --vio: #9d7bff;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: #333 var(--bg); }
body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 56px 56px;
}
::selection { background: var(--acid); color: #000; }
.wrap { max-width: 1380px; margin: 0 auto; padding: 28px 32px 80px; }

/* ============ 通用组件 ============ */
.card {
    background: linear-gradient(180deg, rgba(255,255,255,.02), transparent 40%), var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 18px;
    position: relative;
    transition: border-color .3s;
}
.card:hover { border-color: var(--line2); }
.card::before {
    content: ''; position: absolute; top: -1px; left: 24px; right: 60%;
    height: 1px; background: linear-gradient(90deg, var(--acid), transparent);
    opacity: 0; transition: opacity .3s;
}
.card:hover::before { opacity: .7; }
.sec-tag {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
    color: var(--acid); text-transform: uppercase; margin-bottom: 14px;
}
.sec-tag i, .sec-tag svg { width: 13px; height: 13px; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: .01em; }

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
    color: var(--txt2); text-transform: uppercase;
}
input, select, textarea {
    padding: 0 12px; border: 1px solid var(--line2); border-radius: 3px;
    font-size: 14px; outline: none; background: var(--bg2); color: var(--txt);
    font-family: var(--mono); height: 38px; transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
    border-color: var(--acid); box-shadow: 0 0 0 3px rgba(200,255,0,.08);
}
input::placeholder, textarea::placeholder { color: var(--txt3); }
input[type=text], input[type=password] { width: 260px; }
input[type=number] { width: 110px; }
select { width: 130px; cursor: pointer; }
textarea { font-size: 13px; resize: vertical; height: auto; padding: 10px 12px; }

button {
    height: 38px; padding: 0 18px; border: 1px solid var(--acid); border-radius: 3px;
    font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: .04em;
    background: var(--acid); color: #000; font-family: var(--sans);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background .2s, color .2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
button:hover { transform: translateY(-2px); box-shadow: 0 4px 18px rgba(200,255,0,.25); }
button:active { transform: translateY(0); }
button:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
button i, button svg { width: 15px; height: 15px; }
button.ghost { background: transparent; color: var(--acid); }
button.ghost:hover { background: var(--acid-dim); }
button.danger { background: transparent; border-color: var(--red); color: var(--red); }
button.danger:hover { background: rgba(255,61,90,.12); box-shadow: 0 4px 18px rgba(255,61,90,.2); }
button.solid-red { background: var(--red); border-color: var(--red); color: #fff; }
button.sm { height: 30px; padding: 0 12px; font-size: 12px; }
button.sm i, button.sm svg { width: 13px; height: 13px; }

.muted { color: var(--txt2); font-size: 12px; }
code { font-family: var(--mono); color: var(--acid); }

/* ============ 登录门 ============ */
#loginGate {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 56px 56px;
    overflow: hidden;
}
#loginGate::after {
    content: ''; position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(200,255,0,.07), transparent 60%);
    top: -200px; right: -180px; pointer-events: none;
    animation: drift 12s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(-80px, 60px); } }
.gate-kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .5em; color: var(--txt2);
    text-transform: uppercase; margin-bottom: 18px; animation: rise .8s .1s both;
}
.gate-title {
    font-size: clamp(44px, 9vw, 96px); font-weight: 700; line-height: .95;
    letter-spacing: -.03em; text-align: center; animation: rise .8s .2s both;
}
.gate-title .hl { color: var(--acid); }
.gate-sub {
    font-family: var(--mono); font-size: 12px; color: var(--txt2);
    margin: 22px 0 40px; letter-spacing: .12em; animation: rise .8s .3s both;
}
.gate-box { width: 340px; animation: rise .8s .4s both; position: relative; z-index: 2; }
.gate-box input {
    width: 100%; height: 52px; text-align: center; letter-spacing: .35em;
    font-size: 16px; font-weight: 700;
}
.gate-box button { width: 100%; height: 52px; margin-top: 14px; font-size: 15px; }
.gate-foot {
    position: absolute; bottom: 28px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .3em; color: var(--txt3); animation: rise .8s .6s both;
}
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.gate-err {
    font-family: var(--mono); font-size: 12px; color: var(--red);
    height: 18px; margin-top: 12px; text-align: center; letter-spacing: .08em;
}

/* ============ 顶栏 ============ */
header.topbar {
    display: flex; align-items: center; gap: 18px; margin-bottom: 26px;
    padding-bottom: 20px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
    width: 42px; height: 42px; border: 1px solid var(--acid); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; color: var(--acid);
    box-shadow: inset 0 0 18px rgba(200,255,0,.08);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand h1 { font-size: 19px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
.brand .sub { font-family: var(--mono); font-size: 10px; letter-spacing: .28em; color: var(--txt2); text-transform: uppercase; margin-top: 3px; }
.topbar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.live-dot {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--grn);
}
.live-dot::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--grn);
    box-shadow: 0 0 8px var(--grn); animation: pulse 1.6s infinite;
}
@keyframes pulse { 50% { opacity: .3; } }

/* ============ 统计 ============ */
.stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 18px;
}
.stat-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 18px 18px 14px; position: relative; overflow: hidden;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), border-color .25s;
}
.stat-card:hover { transform: translateY(-4px); border-color: var(--line2); }
.stat-card .num {
    font-family: var(--mono); font-size: 34px; font-weight: 700;
    letter-spacing: -.02em; line-height: 1; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
}
.stat-card .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: .2em;
    color: var(--txt2); text-transform: uppercase;
}
.stat-card::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
    background: var(--sc, var(--line2)); transform: scaleX(0);
    transform-origin: left; transition: transform .4s cubic-bezier(.22,1,.36,1);
}
.stat-card:hover::after { transform: scaleX(1); }
.c-acid { color: var(--acid); } .c-grn { color: var(--grn); } .c-red { color: var(--red); }
.c-org { color: var(--org); } .c-vio { color: var(--vio); } .c-dim { color: var(--txt2); }

/* ============ Tabs ============ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab {
    padding: 12px 22px; cursor: pointer; font-size: 13px; font-weight: 700;
    color: var(--txt2); letter-spacing: .06em; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all .2s; display: flex; align-items: center; gap: 8px;
}
.tab svg { width: 15px; height: 15px; }
.tab:hover { color: var(--txt); }
.tab.active { color: var(--acid); border-bottom-color: var(--acid); }

/* ============ 表格 ============ */
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
.toolbar-left, .toolbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th {
    font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
    color: var(--txt2); text-transform: uppercase; font-weight: 400; background: var(--bg2);
}
tbody tr { transition: background .15s; }
tbody tr:hover td { background: rgba(200,255,0,.03); }
tr.selected td { background: var(--acid-dim); }
tbody tr:last-child td { border-bottom: none; }
.tag {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    border-radius: 2px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    border: 1px solid;
}
.tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.tag.active { color: var(--grn); border-color: rgba(0,224,127,.35); background: rgba(0,224,127,.07); }
.tag.locked { color: var(--red); border-color: rgba(255,61,90,.35); background: rgba(255,61,90,.07); }
.tag.frozen { color: var(--org); border-color: rgba(255,159,28,.35); background: rgba(255,159,28,.07); }
.tag.expired { color: var(--txt2); border-color: var(--line2); background: var(--bg2); }
.actions { display: flex; gap: 5px; }
.device-list { display: flex; flex-wrap: wrap; gap: 5px; }
.device-tag {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg2);
    border: 1px solid var(--line2); padding: 3px 8px; border-radius: 2px;
    font-family: var(--mono); font-size: 11px; cursor: pointer; transition: border-color .2s;
}
.device-tag:hover { border-color: var(--acid); }
.device-tag button {
    height: 15px; width: 15px; padding: 0; border-radius: 50%; font-size: 9px;
    background: transparent; border: 1px solid var(--red); color: var(--red);
    box-shadow: none; display: inline-flex; align-items: center; justify-content: center;
}
.device-tag button:hover { background: var(--red); color: #fff; transform: none; }
.note-cell { max-width: 130px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.note-cell:hover { color: var(--acid); }
.empty { text-align: center; color: var(--txt3); padding: 44px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; }
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--acid); border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 批量条 ============ */
.batch-bar {
    background: var(--acid-dim); border: 1px solid rgba(200,255,0,.3); border-radius: 3px;
    padding: 10px 16px; margin-bottom: 14px; display: flex; align-items: center;
    gap: 10px; font-size: 13px; flex-wrap: wrap;
    animation: slideDown .25s cubic-bezier(.22,1,.36,1);
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } }
.batch-bar .count { font-family: var(--mono); color: var(--acid); font-weight: 700; font-size: 16px; }

/* ============ 分页 ============ */
.pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 18px; }
.pagination .current { font-family: var(--mono); color: var(--acid); font-weight: 700; font-size: 14px; padding: 0 8px; }

/* ============ 输出/日志 ============ */
pre.out {
    background: #060608; color: var(--acid); border: 1px solid rgba(200,255,0,.25);
    padding: 14px; border-radius: 3px; font-size: 12px; font-family: var(--mono);
    overflow: auto; max-height: 300px; white-space: pre-wrap; word-break: break-all;
    text-shadow: 0 0 8px rgba(200,255,0,.3); line-height: 1.7;
}
.log-line {
    padding: 7px 12px; font-family: var(--mono); font-size: 12px;
    border-bottom: 1px solid var(--line); word-break: break-all; color: var(--txt2);
    display: flex; gap: 10px; align-items: baseline;
}
.log-line::before { content: '>'; color: var(--txt3); flex-shrink: 0; }
.log-line:hover { color: var(--txt); background: rgba(255,255,255,.015); }
.log-line:first-child { color: var(--txt); }

/* ============ Toast ============ */
#toastBox { position: fixed; top: 22px; right: 22px; z-index: 1200; display: flex; flex-direction: column; gap: 10px; }
.toast {
    display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 400px;
    background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--acid);
    padding: 13px 16px; border-radius: 3px; font-size: 13px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    animation: toastIn .3s cubic-bezier(.22,1,.36,1);
}
.toast.err { border-left-color: var(--red); }
.toast.err .toast-ic { color: var(--red); }
.toast.ok .toast-ic { color: var(--acid); }
.toast-ic svg { width: 16px; height: 16px; }
.toast.out { animation: toastOut .25s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

/* ============ 模态 ============ */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 1100;
}
.modal {
    background: var(--panel); border: 1px solid var(--line2); border-radius: 4px;
    padding: 26px; min-width: 420px; max-width: 660px; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
    animation: modalIn .3s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(24px) scale(.97); } }
.modal h3 { font-size: 15px; margin-bottom: 18px; display: flex; align-items: center; gap: 9px; }
.modal h3 svg { width: 17px; height: 17px; color: var(--acid); }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.kv-modal { font-family: var(--mono); font-size: 12px; line-height: 1.9; }
.kv-modal .k { color: var(--txt2); margin-right: 10px; }

/* ============ 安全页 ============ */
.toggle-switch { position: relative; display: inline-block; width: 42px; height: 23px; vertical-align: middle; }
.toggle-switch input { display: none; }
.toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--line2); border-radius: 23px; transition: .25s; }
.toggle-slider:before { position: absolute; content: ''; height: 17px; width: 17px; left: 3px; bottom: 3px; background: var(--txt2); border-radius: 50%; transition: .25s; }
.toggle-switch input:checked + .toggle-slider { background: var(--acid); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(19px); background: #000; }

/* ============ 入场动效 ============ */
.anim-in { animation: rise .6s both; }
.anim-in:nth-child(2) { animation-delay: .05s; } .anim-in:nth-child(3) { animation-delay: .1s; }
.anim-in:nth-child(4) { animation-delay: .15s; } .anim-in:nth-child(5) { animation-delay: .2s; }

@media (max-width: 760px) {
    .wrap { padding: 18px 14px 60px; }
    .gate-title { font-size: 13vw; }
    input[type=text], input[type=password] { width: 100%; }
    .row { gap: 10px; }
    .modal { min-width: 0; width: 94vw; }
}
</style>
</head>
<body>
<div id="toastBox"></div>

<div id="loginGate">
    <div class="gate-kicker">RESTRICTED ACCESS</div>
    <div class="gate-title">CARDKEY<br><span class="hl">OS</span></div>
    <div class="gate-sub">ADMIN CONSOLE / 12-CHAR KEY REQUIRED</div>
    <div class="gate-box">
        <input type="password" id="loginPwd" placeholder="············" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()"><i data-lucide="log-in"></i>进入管理终端</button>
        <div class="gate-err" id="gateErr"></div>
    </div>
    <div class="gate-foot">CARDKEY VERIFICATION SYSTEM</div>
</div>

<div class="wrap" id="mainWrap" style="display:none">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark"><i data-lucide="terminal"></i></div>
            <div>
                <h1>CARDKEY OS</h1>
                <div class="sub">ADMIN CONSOLE</div>
            </div>
        </div>
        <div class="topbar-right">
            <span class="live-dot">ONLINE</span>
            <button class="ghost sm" onclick="logoutPanel()"><i data-lucide="log-out"></i>退出</button>
        </div>
    </header>

    <div class="card anim-in" id="statsPanel" style="display:none">
        <div class="toolbar">
            <div class="sec-tag"><i data-lucide="activity"></i>OVERVIEW / 数据概览</div>
            <button class="ghost sm" onclick="loadStats()"><i data-lucide="refresh-cw"></i>刷新</button>
        </div>
        <div class="stats" id="statsGrid"></div>
    </div>

    <div class="card anim-in">
        <div class="sec-tag"><i data-lucide="sparkles"></i>ISSUE / 生成卡密</div>
        <div class="row">
            <div class="field"><label>数量 (1-1000)</label><input type="number" id="issueCount" value="1" min="1" max="1000"></div>
            <div class="field"><label>有效期(天, 0=永久)</label><input type="number" id="issueDays" value="0" min="0"></div>
            <div class="field"><label>计时模式</label><select id="issueExpireMode">
                <option value="create">生成计时</option>
                <option value="activate">激活计时</option>
            </select></div>
            <div class="field"><label>最大设备数</label><input type="number" id="issueMaxDev" value="1" min="1"></div>
            <div class="field"><label>前缀(可选)</label><input type="text" id="issuePrefix" maxlength="6" placeholder="VIP" style="width:100px"></div>
            <button onclick="doIssue()"><i data-lucide="zap"></i>生成卡密</button>
        </div>
        <div id="issueOut"></div>
    </div>

    <div class="card anim-in">
        <div class="tabs" id="mainTabs">
            <div class="tab active" onclick="switchTab('list')"><i data-lucide="layers"></i>卡密列表</div>
            <div class="tab" onclick="switchTab('logs')"><i data-lucide="scroll-text"></i>操作日志</div>
            <div class="tab" onclick="switchTab('security')"><i data-lucide="shield-check"></i>安全防护</div>
        </div>

        <div id="tabList">
            <div class="toolbar">
                <div class="toolbar-left">
                    <input type="text" id="searchInput" placeholder="搜索卡密或备注..." style="width:210px" oninput="onSearchChange()">
                    <select id="statusFilter" onchange="onSearchChange()" style="width:130px">
                        <option value="">全部状态</option>
                        <option value="active">活跃</option>
                        <option value="locked">已锁定</option>
                        <option value="frozen">已冻结</option>
                        <option value="expired">已过期</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <button class="ghost sm" onclick="loadList()"><i data-lucide="refresh-cw"></i>刷新</button>
                    <button class="ghost sm" onclick="exportCSV()"><i data-lucide="file-spreadsheet"></i>CSV</button>
                    <button class="ghost sm" onclick="exportTXT()"><i data-lucide="file-text"></i>TXT</button>
                </div>
            </div>

            <div class="batch-bar" id="batchBar" style="display:none">
                <i data-lucide="check-square" style="width:15px;color:var(--acid)"></i>
                <span>已选 <span class="count" id="batchCount">0</span> 张</span>
                <button class="sm ghost" onclick="batchAction('lock')"><i data-lucide="lock"></i>锁定</button>
                <button class="sm ghost" onclick="batchAction('unlock')"><i data-lucide="lock-open"></i>解锁</button>
                <button class="sm ghost" onclick="batchAction('freeze')"><i data-lucide="snowflake"></i>冻结</button>
                <button class="sm ghost" onclick="batchAction('unfreeze')"><i data-lucide="flame"></i>解冻</button>
                <button class="sm danger" onclick="batchAction('delete')"><i data-lucide="trash-2"></i>删除</button>
                <button class="sm ghost" onclick="clearSelection()"><i data-lucide="x"></i>取消</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:36px"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" style="width:auto;height:auto;accent-color:#c8ff00"></th>
                            <th>卡密</th>
                            <th>状态</th>
                            <th>备注</th>
                            <th>有效期至</th>
                            <th>计时</th>
                            <th>设备</th>
                            <th>次数</th>
                            <th>创建</th>
                            <th style="width:210px">操作</th>
                        </tr>
                    </thead>
                    <tbody id="listBody"></tbody>
                </table>
                <div class="empty" id="emptyTip" style="display:none">NO DATA / 暂无卡密</div>
                <div class="empty" id="loadingTip" style="display:none"><span class="loading"></span>LOADING</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>

        <div id="tabLogs" style="display:none">
            <div class="toolbar">
                <div class="toolbar-left">
                    <select id="logTypeFilter" onchange="loadLogs()" style="width:150px">
                        <option value="">全部类型</option>
                        <option value="生成卡密">生成卡密</option>
                        <option value="卡密操作">卡密操作</option>
                        <option value="批量操作">批量操作</option>
                        <option value="设备解绑">设备解绑</option>
                        <option value="备注更新">备注更新</option>
                        <option value="IP 黑名单">IP 黑名单</option>
                        <option value="IP 白名单">IP 白名单</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <button class="ghost sm" onclick="loadLogs()"><i data-lucide="refresh-cw"></i>刷新</button>
                </div>
            </div>
            <div id="logsContent" style="max-height:500px; overflow-y:auto; border:1px solid var(--line); border-radius:4px"></div>
            <div class="pagination" id="logPagination"></div>
        </div>

        <div id="tabSecurity" style="display:none">
            <div class="row" style="gap:26px; align-items:flex-start">
                <div style="flex:1; min-width:300px">
                    <div class="sec-tag"><i data-lucide="shield-ban"></i>BLACKLIST / IP 黑名单</div>
                    <div class="row" style="margin-bottom:14px">
                        <input type="text" id="blIp" placeholder="IP 地址" style="width:150px">
                        <input type="text" id="blReason" placeholder="拉黑原因" style="width:170px">
                        <button class="sm" onclick="addBlacklist()"><i data-lucide="plus"></i>添加</button>
                    </div>
                    <div id="blacklistTable"></div>
                </div>
                <div style="flex:1; min-width:300px">
                    <div class="sec-tag"><i data-lucide="shield-check"></i>WHITELIST / IP 白名单
                        <label class="toggle-switch" style="margin-left:4px">
                            <input type="checkbox" id="wlEnabled" onchange="toggleWhitelist()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="row" style="margin-bottom:14px">
                        <input type="text" id="wlIp" placeholder="IP 地址" style="width:150px">
                        <button class="sm" onclick="addWhitelist()"><i data-lucide="plus"></i>添加</button>
                    </div>
                    <div id="whitelistTable"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
    <div class="modal" id="modalContent"></div>
</div>

<script>
var token = sessionStorage.getItem('adminToken') || '';
var currentPage = 1, logPage = 1, pageSize = 30, logPageSize = 50;
var selectedCodes = new Set();
var lastSearch = '', lastStatus = '';
var currentTab = 'list';

function icons() { if (window.lucide) lucide.createIcons(); }

/* toast 通知 (替代原生 alert 风格) */
function showMsg(text, ok) {
    var box = document.getElementById('toastBox');
    var t = document.createElement('div');
    t.className = 'toast ' + (ok ? 'ok' : 'err');
    t.innerHTML = '<span class="toast-ic"><i data-lucide="' + (ok ? 'check-circle-2' : 'alert-triangle') + '"></i></span><span>' + text.replace(/</g, '&lt;') + '</span>';
    box.appendChild(t); icons();
    setTimeout(function() { t.classList.add('out'); setTimeout(function() { t.remove(); }, 260); }, 3800);
}

/* 自定义确认模态 (替代原生 confirm) */
function confirmModal(msg, onYes, danger) {
    var content = document.getElementById('modalContent');
    content.innerHTML = '<h3><i data-lucide="alert-triangle"></i>操作确认</h3>' +
        '<div style="font-size:14px;line-height:1.7;color:var(--txt2)">' + msg + '</div>' +
        '<div class="modal-footer">' +
        '<button class="ghost" onclick="closeModal()">取消</button>' +
        '<button class="' + (danger ? 'solid-red' : '') + '" id="cfmYes">确认执行</button></div>';
    document.getElementById('modalOverlay').style.display = 'flex';
    icons();
    document.getElementById('cfmYes').onclick = function() { closeModal(); onYes(); };
}

function doLogin() {
    var pwd = document.getElementById('loginPwd').value.trim();
    var err = document.getElementById('gateErr');
    if (!pwd) { err.textContent = '请输入管理密码'; return; }
    err.textContent = 'VERIFYING...';
    var opts = { method: 'GET', headers: { 'Authorization': 'Bearer ' + pwd } };
    fetch('/api/admin/stats', opts).then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('ACCESS DENIED / 密码错误');
        if (!r.ok) throw new Error('服务异常 (' + r.status + ')');
        return r.json();
    }).then(function (j) {
        if (!j.success) throw new Error('验证失败');
        token = pwd;
        sessionStorage.setItem('adminToken', pwd);
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('mainWrap').style.display = '';
        icons();
        showMsg('身份验证通过, 欢迎回来', true);
        loadStats(); loadList();
    }).catch(function (e) {
        err.textContent = e && e.message ? e.message : '登录失败';
    });
}

function logoutPanel() {
    sessionStorage.removeItem('adminToken');
    token = '';
    document.getElementById('mainWrap').style.display = 'none';
    document.getElementById('loginGate').style.display = '';
    document.getElementById('loginPwd').value = '';
    document.getElementById('gateErr').textContent = '';
}

function copyCodes(btn) {
    var text = window._lastCodes || '';
    if (!text) return;
    navigator.clipboard.writeText(text).then(function() { copyOk(btn); }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); copyOk(btn);
    });
}
function copyOk(btn) {
    btn.innerHTML = '<i data-lucide="check"></i>已复制'; icons();
    setTimeout(function() { btn.innerHTML = '<i data-lucide="copy"></i>一键复制'; icons(); }, 2000);
}

function api(method, path, body) {
    var opts = { method: method, headers: { 'Authorization': 'Bearer ' + token } };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function(r) {
        if (r.status === 401) { showMsg('Token 无效', false); throw new Error('Unauthorized'); }
        if (r.status === 403) { showMsg('IP 被拒绝访问', false); throw new Error('Forbidden'); }
        var ct = '';
        try { ct = r.headers.get('content-type') || ''; } catch (e) {}
        if (ct.indexOf('json') < 0) { showMsg('响应异常 (可能被防护层拦截), 请刷新页面重试', false); throw new Error('Non-JSON response'); }
        return r.json();
    });
}

function fmtTime(ts) {
    if (!ts) return '永久';
    var d = new Date(ts * 1000);
    var p = function(n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('#mainTabs .tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelector('#mainTabs .tab[onclick*="' + tab + '"]').classList.add('active');
    document.getElementById('tabList').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('tabLogs').style.display = tab === 'logs' ? 'block' : 'none';
    document.getElementById('tabSecurity').style.display = tab === 'security' ? 'block' : 'none';
    if (tab === 'logs') loadLogs();
    if (tab === 'security') loadSecurity();
}

function onSearchChange() {
    lastSearch = document.getElementById('searchInput').value.trim();
    lastStatus = document.getElementById('statusFilter').value;
    currentPage = 1; selectedCodes.clear(); updateBatchBar(); loadList();
}

function loadStats() {
    api('GET', '/api/admin/stats').then(function(json) {
        if (!json.success) return;
        var s = json.stats;
        document.getElementById('statsPanel').style.display = 'block';
        var cards = [
            { label: 'TOTAL 总计', num: s.total, cls: 'c-acid', bar: 'var(--acid)' },
            { label: 'ACTIVE 活跃', num: s.active, cls: 'c-grn', bar: 'var(--grn)' },
            { label: 'LOCKED 锁定', num: s.locked, cls: 'c-red', bar: 'var(--red)' },
            { label: 'FROZEN 冻结', num: s.frozen, cls: 'c-org', bar: 'var(--org)' },
            { label: 'EXPIRED 过期', num: s.expired, cls: 'c-dim', bar: 'var(--line2)' },
            { label: 'USED 已用', num: s.usedCards, cls: 'c-vio', bar: 'var(--vio)' },
            { label: 'UNUSED 未用', num: s.unusedCards, cls: 'c-dim', bar: 'var(--line2)' },
            { label: 'DEVICES 设备', num: s.totalDevices, cls: 'c-acid', bar: 'var(--acid)' },
            { label: 'VERIFY 验证次数', num: s.totalUseCount, cls: 'c-org', bar: 'var(--org)' }
        ];
        document.getElementById('statsGrid').innerHTML = cards.map(function(c) {
            return '<div class="stat-card" style="--sc:' + c.bar + '"><div class="num ' + c.cls + '">' + c.num + '</div><div class="lbl">' + c.label + '</div></div>';
        }).join('');
    }).catch(function() {});
}

function statusTag(s) {
    var map = { active: 'ACTIVE', locked: 'LOCKED', frozen: 'FROZEN', expired: 'EXPIRED' };
    return '<span class="tag ' + s + '">' + (map[s] || s) + '</span>';
}

function loadList() {
    var body = document.getElementById('listBody');
    var emptyTip = document.getElementById('emptyTip');
    var loadingTip = document.getElementById('loadingTip');
    loadingTip.style.display = 'block'; emptyTip.style.display = 'none'; body.innerHTML = '';

    var params = '?page=' + currentPage + '&size=' + pageSize;
    if (lastSearch) params += '&search=' + encodeURIComponent(lastSearch);
    if (lastStatus) params += '&status=' + encodeURIComponent(lastStatus);

    api('GET', '/api/admin/list' + params).then(function(json) {
        loadingTip.style.display = 'none';
        if (!json.success) { showMsg(json.message || '加载失败'); return; }
        var list = json.cards || [];
        var pg = json.pagination || {};
        emptyTip.style.display = list.length ? 'none' : 'block';

        list.forEach(function(c) {
            var tr = document.createElement('tr');
            if (selectedCodes.has(c.code)) tr.classList.add('selected');
            var checked = selectedCodes.has(c.code) ? ' checked' : '';
            var devicesHtml = '';
            if (c.devices && c.devices.length > 0) {
                devicesHtml = '<div class="device-list">' + c.devices.map(function(d) {
                    var fp = c.fingerprints ? (c.fingerprints[d] || '') : '';
                    return '<span class="device-tag" onclick="event.stopPropagation();showDeviceInfo(\'' + c.code + '\',\'' + d + '\',\'' + fp + '\')" title="点击查看详情"><i data-lucide="smartphone" style="width:11px;height:11px"></i>' + d.substring(0, 10) + '<button onclick="event.stopPropagation();confirmUnbind(\'' + c.code + '\',\'' + d + '\')" title="解绑">x</button></span>';
                }).join('') + '</div>';
            } else {
                devicesHtml = '<span class="muted">-</span>';
            }
            tr.innerHTML =
                '<td><input type="checkbox" data-code="' + c.code + '"' + checked + ' onclick="toggleCode(event, \'' + c.code + '\')" style="width:auto;height:auto;accent-color:#c8ff00"></td>' +
                '<td><code style="font-size:12px">' + c.code + '</code></td>' +
                '<td>' + statusTag(c.status) + '</td>' +
                '<td class="note-cell" onclick="editNote(\'' + c.code + '\',\'' + (c.note || '').replace(/'/g, "\\'") + '\')" title="点击编辑备注">' + (c.note || '<span class="muted">-</span>') + '</td>' +
                '<td style="font-family:var(--mono);font-size:12px;color:var(--txt2)">' + fmtTime(c.expireAt) + '</td>' +
                '<td><span class="muted" style="font-family:var(--mono);font-size:11px">' + (c.expireMode === 'activate' ? 'ACT' : 'GEN') + '</span></td>' +
                '<td>' + devicesHtml + '</td>' +
                '<td style="font-family:var(--mono)">' + (c.useCount || 0) + '</td>' +
                '<td style="font-family:var(--mono);font-size:12px;color:var(--txt2)">' + fmtTime(c.createdAt) + '</td>' +
                '<td><div class="actions">' +
                '<button class="sm ghost" title="锁定" onclick="doAction(\'' + c.code + '\',\'lock\')"><i data-lucide="lock"></i></button>' +
                '<button class="sm ghost" title="解锁" onclick="doAction(\'' + c.code + '\',\'unlock\')"><i data-lucide="lock-open"></i></button>' +
                '<button class="sm ghost" title="冻结" onclick="doAction(\'' + c.code + '\',\'freeze\')"><i data-lucide="snowflake"></i></button>' +
                '<button class="sm ghost" title="解冻" onclick="doAction(\'' + c.code + '\',\'unfreeze\')"><i data-lucide="flame"></i></button>' +
                '<button class="sm danger" title="删除" onclick="doAction(\'' + c.code + '\',\'delete\')"><i data-lucide="trash-2"></i></button>' +
                '</div></td>';
            body.appendChild(tr);
        });
        renderPagination(pg, 'pagination', goPage);
        updateSelectAllState(); icons();
    }).catch(function(e) {
        loadingTip.style.display = 'none';
        if (e.message !== 'Unauthorized' && e.message !== 'Forbidden') showMsg('请求失败: ' + e.message, false);
    });
}

function loadLogs() {
    var params = '?page=' + logPage + '&size=' + logPageSize;
    var typeFilter = document.getElementById('logTypeFilter').value;
    if (typeFilter) params += '&type=' + encodeURIComponent(typeFilter);
    api('GET', '/api/admin/logs' + params).then(function(json) {
        if (!json.success) return;
        var logs = json.logs || [];
        var pg = json.pagination || {};
        var html = logs.length ? '' : '<div class="empty">暂无日志</div>';
        logs.forEach(function(l) { html += '<div class="log-line">' + l + '</div>'; });
        document.getElementById('logsContent').innerHTML = html;
        renderPagination(pg, 'logPagination', goLogPage);
    }).catch(function() {});
}

function goPage(p) { currentPage = p; loadList(); }
function goLogPage(p) { logPage = p; loadLogs(); }

function renderPagination(pg, id, handler) {
    var p = document.getElementById(id);
    if (!pg || pg.pages <= 1) { p.innerHTML = ''; return; }
    var html = '';
    html += '<button class="ghost sm" ' + (pg.page <= 1 ? 'disabled' : '') + ' onclick="' + handler.name + '(' + (pg.page - 1) + ')"><i data-lucide="chevron-left"></i></button>';
    html += '<span class="current">' + pg.page + ' / ' + pg.pages + '</span>';
    html += '<button class="ghost sm" ' + (pg.page >= pg.pages ? 'disabled' : '') + ' onclick="' + handler.name + '(' + (pg.page + 1) + ')"><i data-lucide="chevron-right"></i></button>';
    html += '<span class="muted" style="font-family:var(--mono)">共 ' + pg.total + ' 条</span>';
    p.innerHTML = html; icons();
}

function toggleCode(e, code) {
    e.stopPropagation();
    if (e.target.checked) selectedCodes.add(code); else selectedCodes.delete(code);
    updateBatchBar(); updateSelectAllState();
}

function toggleSelectAll() {
    var checkboxes = document.querySelectorAll('#listBody input[type=checkbox]');
    var all = document.getElementById('selectAll');
    checkboxes.forEach(function(cb) {
        if (all.checked) selectedCodes.add(cb.getAttribute('data-code'));
        else selectedCodes.delete(cb.getAttribute('data-code'));
        cb.checked = all.checked;
    });
    updateBatchBar();
    document.querySelectorAll('#listBody tr').forEach(function(tr) {
        if (all.checked) tr.classList.add('selected'); else tr.classList.remove('selected');
    });
}

function updateSelectAllState() {
    var checkboxes = document.querySelectorAll('#listBody input[type=checkbox]');
    var all = document.getElementById('selectAll');
    all.checked = checkboxes.length > 0 && Array.from(checkboxes).every(function(cb) { return cb.checked; });
    all.indeterminate = !all.checked && Array.from(checkboxes).some(function(cb) { return cb.checked; });
}

function updateBatchBar() {
    var bar = document.getElementById('batchBar');
    document.getElementById('batchCount').textContent = selectedCodes.size;
    bar.style.display = selectedCodes.size > 0 ? 'flex' : 'none';
    icons();
}

function clearSelection() { selectedCodes.clear(); updateBatchBar(); loadList(); }

function batchAction(action) {
    if (selectedCodes.size === 0) return;
    var codes = Array.from(selectedCodes);
    var msg = action === 'delete'
        ? '确认删除 <b style="color:var(--red)">' + codes.length + '</b> 张卡密？此操作不可恢复。'
        : '确认对 <b style="color:var(--acid)">' + codes.length + '</b> 张卡密执行 <code>' + action + '</code> 操作？';
    confirmModal(msg, function() {
        api('POST', '/api/admin/batch', { codes: codes, action: action }).then(function(json) {
            if (!json.success) { showMsg(json.message || '操作失败', false); return; }
            showMsg('成功 ' + json.affected + ' 张, 跳过 ' + json.skipped + ' 张', true);
            selectedCodes.clear(); updateBatchBar(); loadList(); loadStats();
        }).catch(function(e) { showMsg('请求失败: ' + (e && e.message ? e.message : '网络异常'), false); });
    }, action === 'delete');
}

function doIssue() {
    var count = parseInt(document.getElementById('issueCount').value, 10) || 1;
    var days = parseInt(document.getElementById('issueDays').value, 10) || 0;
    var maxDev = parseInt(document.getElementById('issueMaxDev').value, 10) || 1;
    var prefix = document.getElementById('issuePrefix').value.trim().toUpperCase();
    var expireMode = document.getElementById('issueExpireMode').value;
    api('POST', '/api/admin/issue', { count: count, days: days, max_devices: maxDev, prefix: prefix, expire_mode: expireMode }).then(function(json) {
        if (!json.success) { showMsg(json.message || '生成失败', false); return; }
        showMsg('成功生成 ' + json.codes.length + ' 张卡密', true);
        var codesText = json.codes.join('\n');
        document.getElementById('issueOut').innerHTML =
            '<div style="display:flex;align-items:stretch;gap:10px;margin-top:16px">' +
            '<pre class="out" style="flex:1">' + codesText + '</pre>' +
            '<button onclick="copyCodes(this)" style="align-self:flex-start"><i data-lucide="copy"></i>一键复制</button></div>';
        window._lastCodes = codesText;
        icons();
        loadList(); loadStats();
    }).catch(function(e) { showMsg('请求失败: ' + e.message, false); });
}

function doAction(code, action) {
    var run = function() {
        api('POST', '/api/admin/card', { code: code, action: action }).then(function(json) {
            if (!json.success) { showMsg(json.message || '操作失败', false); return; }
            showMsg('操作成功: ' + code + ' -> ' + action, true);
            selectedCodes.delete(code); updateBatchBar(); loadList(); loadStats();
        }).catch(function(e) { showMsg('请求失败: ' + e.message, false); });
    };
    if (action === 'delete') confirmModal('确认删除卡密 <code>' + code + '</code>？此操作不可恢复。', run, true);
    else run();
}

function confirmUnbind(code, deviceUuid) {
    confirmModal('确认解绑设备 <code>' + deviceUuid.substring(0, 12) + '...</code>？', function() {
        unbindDevice(code, deviceUuid, true);
    }, true);
}

function unbindDevice(code, deviceUuid, skipConfirm) {
    api('POST', '/api/admin/unbind', { code: code, device_uuid: deviceUuid }).then(function(json) {
        if (!json.success) { showMsg(json.message || '解绑失败', false); return; }
        showMsg('设备已解绑', true);
        loadList(); loadStats();
    }).catch(function(e) { showMsg('请求失败: ' + e.message, false); });
}

function editNote(code, currentNote) {
    var modal = document.getElementById('modalOverlay');
    var content = document.getElementById('modalContent');
    content.innerHTML = '<h3><i data-lucide="pen-line"></i>编辑备注 - ' + code + '</h3>' +
        '<textarea id="noteInput" rows="3" style="width:100%">' + (currentNote || '') + '</textarea>' +
        '<div class="modal-footer">' +
        '<button class="ghost" onclick="closeModal()">取消</button>' +
        '<button onclick="saveNote(\'' + code + '\')"><i data-lucide="save"></i>保存</button>' +
        '</div>';
    modal.style.display = 'flex'; icons();
}

function saveNote(code) {
    var note = document.getElementById('noteInput').value.trim().substring(0, 200);
    api('POST', '/api/admin/note', { code: code, note: note }).then(function(json) {
        if (!json.success) { showMsg(json.message || '保存失败', false); return; }
        showMsg('备注已保存', true);
        closeModal(); loadList();
    }).catch(function(e) { showMsg('请求失败: ' + e.message, false); });
}

function closeModal(e) {
    if (e && e.target !== document.getElementById('modalOverlay')) return;
    document.getElementById('modalOverlay').style.display = 'none';
}

function showDeviceInfo(code, uuid, fingerprint) {
    var modal = document.getElementById('modalOverlay');
    var content = document.getElementById('modalContent');
    content.innerHTML = '<h3><i data-lucide="smartphone"></i>设备详情</h3>' +
        '<div class="kv-modal" style="margin-bottom:16px">' +
        '<div><span class="k">卡密</span><code>' + code + '</code></div>' +
        '<div><span class="k">设备UUID</span><span style="word-break:break-all">' + uuid + '</span> <button class="sm ghost" onclick="copyText(\'' + uuid + '\',this)">复制</button></div>' +
        '<div><span class="k">设备指纹</span><span style="word-break:break-all;font-size:11px;color:var(--txt2)">' + (fingerprint || '未记录') + '</span></div>' +
        '</div>' +
        '<div class="modal-footer">' +
        '<button class="ghost" onclick="closeModal()">关闭</button>' +
        '<button class="solid-red" onclick="closeModal();confirmUnbind(\'' + code + '\',\'' + uuid + '\')"><i data-lucide="unlink"></i>解绑此设备</button>' +
        '</div>';
    modal.style.display = 'flex'; icons();
}

function copyText(text, btn) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(function() { copyOk2(btn); }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); copyOk2(btn);
    });
}
function copyOk2(btn) {
    btn.innerHTML = '<i data-lucide="check"></i>已复制'; icons();
    setTimeout(function() { btn.innerHTML = '复制'; }, 2000);
}

function exportCSV() {
    api('GET', '/api/admin/list?size=10000').then(function(json) {
        if (!json.success) { showMsg(json.message || '加载失败', false); return; }
        var list = json.cards || [];
        var csv = '卡密,状态,备注,有效期至,最大设备,已绑设备,使用次数,创建时间\n';
        list.forEach(function(c) {
            csv += [c.code, c.status, c.note || '', fmtTime(c.expireAt), c.maxDevices, (c.devices || []).join(';'), c.useCount || 0, fmtTime(c.createdAt)].join(',') + '\n';
        });
        download('卡密列表_' + new Date().toISOString().substring(0, 10) + '.csv', csv, 'text/csv;charset=utf-8');
        showMsg('导出 ' + list.length + ' 条', true);
    }).catch(function() {});
}

function exportTXT() {
    api('GET', '/api/admin/list?size=10000').then(function(json) {
        if (!json.success) { showMsg(json.message || '加载失败', false); return; }
        var list = json.cards || [];
        var txt = '卡密号\t状态\t备注\t有效期至\t已绑/最大\n' + '='.repeat(60) + '\n';
        list.forEach(function(c) {
            txt += [c.code, c.status, c.note || '', fmtTime(c.expireAt), (c.devices || []).length + '/' + c.maxDevices].join('\t') + '\n';
        });
        download('卡密列表_' + new Date().toISOString().substring(0, 10) + '.txt', txt, 'text/plain;charset=utf-8');
        showMsg('导出 ' + list.length + ' 条', true);
    }).catch(function() {});
}

function download(name, content, mime) {
    var blob = new Blob(['\uFEFF' + content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
}

/* ==================== 安全防护 ==================== */
function loadSecurity() { loadBlacklist(); loadWhitelist(); }

function loadBlacklist() {
    api('GET', '/api/admin/blacklist').then(function(json) {
        if (!json.success) return;
        var bl = json.blacklist;
        var html = '';
        if (bl.ips.length === 0) {
            html = '<div class="empty" style="padding:22px 0">暂无黑名单 IP</div>';
        } else {
            html = '<div class="table-wrap"><table><thead><tr><th>IP</th><th>原因</th><th>操作</th></tr></thead><tbody>';
            bl.ips.forEach(function(ip) {
                html += '<tr><td><code style="font-size:12px">' + ip + '</code></td><td style="color:var(--txt2)">' + (bl.reason[ip] || '-') + '</td><td><button class="sm danger" onclick="removeBlacklist(\'' + ip + '\')"><i data-lucide="x"></i>移除</button></td></tr>';
            });
            html += '</tbody></table></div>';
        }
        document.getElementById('blacklistTable').innerHTML = html; icons();
    }).catch(function() {});
}

function addBlacklist() {
    var ip = document.getElementById('blIp').value.trim();
    var reason = document.getElementById('blReason').value.trim();
    if (!ip) { showMsg('请输入 IP 地址', false); return; }
    api('POST', '/api/admin/blacklist', { ip: ip, reason: reason }).then(function(json) {
        if (!json.success) { showMsg(json.message || '添加失败', false); return; }
        showMsg('IP ' + ip + ' 已加入黑名单', true);
        document.getElementById('blIp').value = '';
        document.getElementById('blReason').value = '';
        loadBlacklist();
    }).catch(function() {});
}

function removeBlacklist(ip) {
    api('DELETE', '/api/admin/blacklist', { ip: ip }).then(function(json) {
        if (!json.success) { showMsg(json.message || '移除失败', false); return; }
        showMsg('IP ' + ip + ' 已从黑名单移除', true);
        loadBlacklist();
    }).catch(function() {});
}

function loadWhitelist() {
    api('GET', '/api/admin/whitelist').then(function(json) {
        if (!json.success) return;
        var wl = json.whitelist;
        document.getElementById('wlEnabled').checked = wl.enabled;
        var html = '';
        if (wl.ips.length === 0) {
            html = '<div class="empty" style="padding:22px 0">暂无白名单 IP</div>';
        } else {
            html = '<div class="table-wrap"><table><thead><tr><th>IP</th><th>操作</th></tr></thead><tbody>';
            wl.ips.forEach(function(ip) {
                html += '<tr><td><code style="font-size:12px">' + ip + '</code></td><td><button class="sm danger" onclick="removeWhitelist(\'' + ip + '\')"><i data-lucide="x"></i>移除</button></td></tr>';
            });
            html += '</tbody></table></div>';
        }
        document.getElementById('whitelistTable').innerHTML = html; icons();
    }).catch(function() {});
}

function addWhitelist() {
    var ip = document.getElementById('wlIp').value.trim();
    if (!ip) { showMsg('请输入 IP 地址', false); return; }
    api('POST', '/api/admin/whitelist', { ip: ip }).then(function(json) {
        if (!json.success) { showMsg(json.message || '添加失败', false); return; }
        showMsg('IP ' + ip + ' 已加入白名单', true);
        document.getElementById('wlIp').value = '';
        loadWhitelist();
    }).catch(function() {});
}

function removeWhitelist(ip) {
    api('DELETE', '/api/admin/whitelist', { ip: ip }).then(function(json) {
        if (!json.success) { showMsg(json.message || '移除失败', false); return; }
        showMsg('IP ' + ip + ' 已从白名单移除', true);
        loadWhitelist();
    }).catch(function() {});
}

function toggleWhitelist() {
    var enabled = document.getElementById('wlEnabled').checked;
    api('POST', '/api/admin/whitelist', { enabled: enabled }).then(function(json) {
        if (!json.success) { showMsg(json.message || '操作失败', false); return; }
        showMsg('白名单已' + (enabled ? '启用' : '禁用'), true);
    }).catch(function() {});
}
